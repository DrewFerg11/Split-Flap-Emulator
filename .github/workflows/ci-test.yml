name: CI / Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Verified runtime image
    needs: [fast-checks, qemu-boot]
    uses: ./.github/workflows/ci-container.yml

  fast-checks:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjson-c-dev
          python -m pip install -e '.[dev,control]' clang-format==18.1.8
      - name: Lint and format Python
        run: |
          ruff check .
          ruff format --check .
      - name: Format C integration sources
        run: |
          clang-format --dry-run --Werror model/*.c model/*.h qemu/*.c qemu/*.h tests/fixtures/*.c \
            native/*.cpp native/shim/*.cpp native/shim/*.h native/shim/freertos/*.h native/tests/*.cpp
      - name: Verify editable install, CLI, and failure boundaries
        run: |
          flapsim --help
          python -m pytest

  native:
    name: Native firmware (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: golden source, build_flags: '', timeout: 120}
          - {name: sanitizers, build_flags: --sanitize, timeout: 300}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            pkg-config libjson-c-dev mosquitto
          python -m pip install -e '.[control]'
      - name: Restore pinned firmware and library sources
        uses: actions/cache@v4
        with:
          path: build/native/cache
          key: native-sources-${{ hashFiles('native/libraries.json', 'tools/golden_firmware.json') }}
      - name: Build the pinned golden source against the shims and run the shim tests
        run: |
          set -o pipefail
          python native/build.py --jobs 4 --test ${{ matrix.build_flags }} --out build/native/golden \
            2>&1 | tee runs-native-build.log
      # Uncalibrated firmware lands near, not on, X on the realistic presets (#29), so the
      # strict boot-at-X check covers the ideal-geometry layouts.
      - name: Boot the ideal layouts and reboot through Improv provisioning
        run: |
          set -e
          for hardware in esp32-8-single esp32-16-dual esp32-8-single-perfect esp32-16-dual-perfect; do
            python -m tools.verify_native --build build/native/golden --hardware "$hardware" \
              --case boot --timeout ${{ matrix.timeout }} --out "runs/native/boot-$hardware"
          done
          for hardware in esp32-8-single esp32-16-dual; do
            python -m tools.verify_native --build build/native/golden --hardware "$hardware" \
              --case improv-reboot --timeout ${{ matrix.timeout }} --out "runs/native/improv-$hardware"
          done
      - name: Verify native control and mechanics across a firmware reset
        run: |
          for hardware in esp32-8-single esp32-16-dual; do
            python -m tools.verify_native --build build/native/golden --hardware "$hardware" \
              --case control --timeout ${{ matrix.timeout }} --out "runs/native/control-$hardware"
          done
      - name: Verify controller power and checkpoint resume on both layouts
        run: |
          set -e
          for hardware in esp32-8-single esp32-16-dual; do
            python -m tools.verify_power --mode native --native-build build/native/golden \
              --hardware "$hardware" --out "runs/native/power-$hardware"
          done
          python -m tools.verify_power --mode native --native-build build/native/golden \
            --end-off --out runs/native/power-end-off
          for result in timeout interrupt; do
            python -m tools.verify_power --mode native --native-build build/native/golden \
              --off-exit "$result" --out "runs/native/power-off-$result"
          done
      - name: Run the golden smoke scenarios natively under the native known-issues baseline
        if: matrix.name != 'sanitizers'
        run: |
          set -e
          for layout in "8 esp32-8-single" "16 esp32-16-dual"; do
            set -- $layout
            flapsim run --mode native --native-build build/native/golden --hardware "$2" \
              --scenario "scenarios/release-smoke-$1.yaml" --seed 7 --var FIRMWARE_VERSION=v1.4.1 \
              --known-issues baselines/v1.4.1-native.yaml --out "runs/native/smoke-$1"
          done
      - name: Run MQTT and controlled-clock scenarios natively
        if: matrix.name != 'sanitizers'
        run: |
          set -e
          for scenario in mqtt-native-8 clock-dst-native-8 date-rollover-native-8; do
            flapsim run --mode native --native-build build/native/golden --hardware esp32-8-single \
              --scenario "$scenario" --seed 7 --var FIRMWARE_VERSION=v1.4.1 \
              --known-issues baselines/v1.4.1-native.yaml --out "runs/native/$scenario"
          done
      - name: Run the first-boot scenarios natively on both layouts
        if: matrix.name != 'sanitizers'
        run: |
          set -e
          for layout in "8 esp32-8-single" "16 esp32-16-dual"; do
            set -- $layout
            flapsim run --mode native --native-build build/native/golden --hardware "$2" \
              --scenario "first-boot-$1" --seed 7 --var FIRMWARE_VERSION=v1.4.1 \
              --known-issues baselines/v1.4.1-native.yaml --out "runs/native/first-boot-$1"
          done
      - name: Run injected-fault scenarios natively
        if: matrix.name != 'sanitizers'
        run: |
          set -e
          for fault in "stuck-sensor esp32-8-single-stuck-sensor" "module-lost esp32-8-single-module-lost"; do
            set -- $fault
            flapsim run --mode native --native-build build/native/golden --hardware "$2" \
              --scenario "fault-$1-8" --seed 7 --var FIRMWARE_VERSION=v1.4.1 \
              --known-issues baselines/v1.4.1-native.yaml --out "runs/native/fault-$1-8"
          done
      - name: Log native scenario outcomes
        if: always() && matrix.name != 'sanitizers'
        run: |
          for run in smoke-8 smoke-16 mqtt-native-8 clock-dst-native-8 date-rollover-native-8 \
                     first-boot-8 first-boot-16 fault-stuck-sensor-8 fault-module-lost-8; do
            python -m tools.summarize_run "runs/native/$run/run.json"
          done
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.name == 'sanitizers' && 'sanitizers' || 'golden' }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            runs-native-build.log
            build/native/golden/build-info.json
            runs/native/**/*.json
            runs/native/**/*.jsonl
            runs/native/**/*.log
            runs/native/**/*.md
            runs/native/**/*.xml
            runs/native/**/*.html

  qemu-boot:
    name: Golden scenario (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: smoke-8, hardware: esp32-8-single, scenario: release-smoke-8, seed: 7}
          - {name: smoke-16, hardware: esp32-16-dual, scenario: release-smoke-16, seed: 7}
          - {name: homing-7, hardware: esp32-8-single, scenario: homing-random, seed: 7}
          - {name: homing-19, hardware: esp32-8-single, scenario: homing-random, seed: 19}
          - {name: homing-42, hardware: esp32-8-single, scenario: homing-random, seed: 42}
          - {name: negative-versions, hardware: esp32-8-single, scenario: version-check, seed: 7}
          - {name: calibration-8, hardware: esp32-8-single-calibration, scenario: calibration-8, seed: 7}
          - {name: control-8, hardware: esp32-8-single, scenario: boot, seed: 7}
          - {name: control-16, hardware: esp32-16-dual, scenario: boot, seed: 7}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git ninja-build \
            libglib2.0-dev libgcrypt20-dev libslirp-dev libpixman-1-dev \
            python3-venv flex bison pkg-config libjson-c-dev
      - name: Record toolchain for cache identity
        id: toolchain
        shell: bash
        run: |
          mkdir -p build runs
          {
            cc --version
            ld --version
            python --version
            ninja --version
            pkg-config --modversion glib-2.0 libgcrypt slirp pixman-1 json-c
            dpkg-query -W build-essential libc6-dev
          } > build/toolchain.txt
          lscpu > build/runner-specs.txt
          echo "digest=$(sha256sum build/toolchain.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore compatible QEMU build cache
        uses: actions/cache@v4
        with:
          path: build/qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('qemu/QEMU_COMMIT', 'qemu/build.py', 'qemu/build.sh', '.github/workflows/ci-test.yml') }}-${{ hashFiles('qemu/*.c', 'qemu/*.h', 'model/*.c', 'model/*.h') }}
          restore-keys: |
            qemu-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('qemu/QEMU_COMMIT', 'qemu/build.py', 'qemu/build.sh', '.github/workflows/ci-test.yml') }}-
      - name: Build pinned integration
        shell: bash
        run: |
          set -o pipefail
          timeout --kill-after=30s 18m qemu/build.sh --jobs 4 2>&1 | tee runs/qemu-build.log
      - name: Install Python configuration loader
        run: python -m pip install -e '.[control]'
      - name: Fetch checksum-verified golden firmware
        run: python -m tools.verify_model --fetch-only
      - name: Run real-firmware golden scenario
        if: matrix.name != 'negative-versions' && !startsWith(matrix.name, 'control-')
        run: |
          flapsim run --firmware firmware/splitflap-esp32_n4-v1.4.1-factory.bin \
            --hardware "${{ matrix.hardware }}" --scenario "scenarios/${{ matrix.scenario }}.yaml" \
            --seed "${{ matrix.seed }}" --var FIRMWARE_VERSION=v1.4.1 \
            --known-issues baselines/v1.4.1-golden.yaml \
            --out runs/scenario
          python -c 'import json; m=json.load(open("runs/scenario/run.json")); print("Scenario wall seconds:", m["wall_seconds"])'
      - name: Prove prerelease and deliberately wrong versions fail
        if: matrix.name == 'negative-versions'
        run: python -m tools.verify_negative_version --out runs/negative-versions
      - name: Verify live state, mechanics, pause and reset
        if: startsWith(matrix.name, 'control-')
        run: |
          python -m tools.verify_control \
            --firmware firmware/splitflap-esp32_n4-v1.4.1-factory.bin \
            --hardware "${{ matrix.hardware }}" --known-issues baselines/v1.4.1-golden.yaml \
            --out runs/scenario
      - name: Verify stopped controller power and power-on during motion
        if: startsWith(matrix.name, 'control-')
        run: |
          python -m tools.verify_power --mode qemu \
            --firmware firmware/splitflap-esp32_n4-v1.4.1-factory.bin \
            --hardware "${{ matrix.hardware }}" --out runs/power
      - name: Log available scenario outcome
        if: always() && matrix.name != 'negative-versions'
        run: python -m tools.summarize_run runs/scenario/run.json
      - name: Log available negative-version outcomes
        if: always() && matrix.name == 'negative-versions'
        run: |
          python -m tools.summarize_run runs/negative-versions/rc-tag/run.json
          python -m tools.summarize_run runs/negative-versions/wrong-version/run.json
      - name: Upload available diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-scenario-evidence-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            runs/**/*.log
            runs/**/*.json
            runs/**/*.jsonl
            runs/**/*.md
            runs/**/*.xml
            runs/**/*.html
            build/toolchain.txt
            build/runner-specs.txt
            build/qemu/install/build-info.json
            build/qemu/work/meson-logs/**
            build/qemu/work/config.log
