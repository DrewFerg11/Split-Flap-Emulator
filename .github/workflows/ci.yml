name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjson-c-dev
          python -m pip install -e '.[dev]' clang-format==18.1.8
      - name: Lint and format Python
        run: |
          ruff check .
          ruff format --check .
      - name: Format C integration sources
        run: clang-format --dry-run --Werror model/*.c model/*.h qemu/*.c qemu/*.h tests/fixtures/*.c
      - name: Verify editable install, CLI, and failure boundaries
        run: |
          flapsim --help
          python -m pytest

  qemu-boot:
    name: Golden scenario (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: smoke-8, hardware: esp32-8-single, scenario: release-smoke-8, seed: 7}
          - {name: smoke-16, hardware: esp32-16-dual, scenario: release-smoke-16, seed: 7}
          - {name: homing-7, hardware: esp32-8-single, scenario: homing-random, seed: 7}
          - {name: homing-19, hardware: esp32-8-single, scenario: homing-random, seed: 19}
          - {name: homing-42, hardware: esp32-8-single, scenario: homing-random, seed: 42}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git ninja-build \
            libglib2.0-dev libgcrypt20-dev libslirp-dev libpixman-1-dev \
            python3-venv flex bison pkg-config libjson-c-dev
      - name: Record toolchain for cache identity
        id: toolchain
        shell: bash
        run: |
          mkdir -p build runs
          {
            cc --version
            ld --version
            python --version
            ninja --version
            pkg-config --modversion glib-2.0 libgcrypt slirp pixman-1 json-c
            dpkg-query -W build-essential libc6-dev
          } > build/toolchain.txt
          lscpu > build/runner-specs.txt
          echo "digest=$(sha256sum build/toolchain.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore compatible QEMU build cache
        uses: actions/cache@v4
        with:
          path: build/qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('qemu/QEMU_COMMIT', 'qemu/build.py', 'qemu/build.sh', '.github/workflows/ci.yml') }}-${{ hashFiles('qemu/*.c', 'qemu/*.h', 'model/*.c', 'model/*.h') }}
          restore-keys: |
            qemu-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('qemu/QEMU_COMMIT', 'qemu/build.py', 'qemu/build.sh', '.github/workflows/ci.yml') }}-
      - name: Build pinned integration
        shell: bash
        run: |
          set -o pipefail
          timeout --kill-after=30s 18m qemu/build.sh --jobs 4 2>&1 | tee runs/qemu-build.log
      - name: Install Python configuration loader
        run: python -m pip install -e .
      - name: Run real-firmware golden scenario
        run: |
          python -m tools.verify_model --fetch-only
          flapsim run --firmware firmware/splitflap-esp32_n4-v1.4.0-factory.bin \
            --hardware "${{ matrix.hardware }}" --scenario "scenarios/${{ matrix.scenario }}.yaml" \
            --seed "${{ matrix.seed }}" --var FIRMWARE_VERSION=v1.4.0 \
            --golden-version-exception --out runs/scenario
          python -c 'import json; m=json.load(open("runs/scenario/run.json")); print("Scenario wall seconds:", m["wall_seconds"])'
      - name: Prove strict and deliberately wrong versions fail
        if: matrix.name == 'smoke-8'
        run: python -m tools.verify_negative_version --out runs/negative-versions
      - name: Log available scenario outcome
        if: always()
        run: python -m tools.summarize_run runs/scenario/run.json
      - name: Upload available diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-scenario-evidence-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            runs/**/*.log
            runs/**/*.json
            runs/**/*.jsonl
            runs/**/*.md
            runs/**/*.xml
            runs/**/*.html
            build/toolchain.txt
            build/runner-specs.txt
            build/qemu/install/build-info.json
            build/qemu/work/meson-logs/**
            build/qemu/work/config.log
