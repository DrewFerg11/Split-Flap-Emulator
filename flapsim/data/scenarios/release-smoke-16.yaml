version: 1
name: release-smoke-16
timeout: 300
steps:
  - wait_serial: "=== Split Flap Display ==="
    timeout: 120
  - wait_serial: "AP IP Address: http://192.168.4.1"
  - wait_display: {text: XXXXXXXXXXXXXXXX}
    timeout: 120
  - expect_serial: "Firmware: ${FIRMWARE_VERSION} ("
  - http: {path: /version, status: 200, json: {version: "${FIRMWARE_VERSION}"}, wait_ready: true}
    timeout: 60
  - assert_no_errors: {fresh_nvs: true}
  - http:
      method: POST
      path: /text
      body: {mode: dual-single, row1: HELLO, row2: WORLD, center: true}
      status: 200
      json: {type: success}
    timeout: 30
  - wait_display: {text: " HELLO   WORLD  "}
    timeout: 120
  - http:
      method: POST
      path: /text
      body: {mode: dual-single, row1: HELLO, row2: WORLD, center: true}
      status: 200
      json: {type: success}
    timeout: 30
  - wait_display: {text: " HELLO   WORLD  ", allow_unchanged: true}
    timeout: 120
  - assert_no_errors: {}
