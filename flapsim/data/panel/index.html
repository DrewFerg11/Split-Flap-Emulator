<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split-Flap Emulator</title>
<style>
/*@SHARED_CSS@*/
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Split-Flap Emulator</h1>
    <div class="meta"><span id="clock"></span><span id="status" class="pill">connecting…</span></div>
  </header>
  <div class="frame">
    <div id="board" aria-label="Virtual display"></div>
    <div id="legend"></div>
  </div>
  <div class="tablewrap" id="modules"></div>
  <p class="meta" id="meta"></p>
</div>
<script>
/*@SHARED_JS@*/
</script>
<script>
"use strict";
const status = document.getElementById("status");
const clock = document.getElementById("clock");
const meta = document.getElementById("meta");
const board = FlapUI.display(document.getElementById("board"));
const modules = FlapUI.table(document.getElementById("modules"));
document.getElementById("legend").append(FlapUI.legend());

function render(envelope) {
  const state = envelope.state;
  board.update(state.modules, true);
  modules.update(state.modules);
  status.className = "pill live";
  status.textContent = "live · " + envelope.backend;
  clock.textContent = "guest t = " + (state.guest_ns / 1e9).toFixed(1) + " s";
  meta.textContent = "Run " + envelope.run_id + " · boot generation " +
    envelope.boot_generation + " · text " + JSON.stringify(state.text);
}

async function poll() {
  try {
    const response = await fetch("/state", { cache: "no-store" });
    const value = await response.json();
    if (!response.ok) throw new Error(value.error || "HTTP " + response.status);
    render(value);
  } catch (error) {
    status.className = "pill down";
    status.textContent = String(error.message || error);
  }
  setTimeout(poll, 250);
}
poll();
</script>
</body>
</html>
