[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flapsim"
version = "0.1.0.dev0"
description = "Run unmodified Split-Flap Display firmware on virtual ESP32 hardware"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.1"]

[project.scripts]
flapsim = "flapsim.cli:main"

[tool.setuptools.packages.find]
include = ["flapsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["poc", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
