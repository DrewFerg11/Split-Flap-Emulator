[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "flapsim"
dynamic = ["version"]
description = "Run unmodified Split-Flap Display firmware on virtual ESP32 hardware"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
control = ["starlette>=0.47,<1", "uvicorn>=0.35,<1", "websockets>=15,<17"]
dev = ["pytest>=8,<10", "ruff==0.17.1", "packaging>=25,<27", "setuptools-scm>=8"]

[project.scripts]
flapsim = "flapsim.cli:main"

[tool.setuptools_scm]
# The version comes from the git tag (vX.Y.Z or vX.Y.Z-rc.N), never from this file. Builds without
# git metadata (the container build, which excludes .git) set SETUPTOOLS_SCM_PRETEND_VERSION_FOR_FLAPSIM.
fallback_version = "0+unknown"

[tool.setuptools.packages.find]
include = ["flapsim*"]

[tool.setuptools.package-data]
flapsim = [
  "data/hardware/*.yaml",
  "data/scenarios/*.yaml",
  "data/panel/*.html",
  "data/replay/*.html",
  "data/ui/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
