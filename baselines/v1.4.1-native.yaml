# Known-issue baseline for native-mode builds of the golden v1.4.1 source (a clean checkout of the
# commit below). Policy and exit criteria: https://github.com/DrewFerg11/Split-Flap-Emulator/issues/15
#
# Used only by the emulator's own native CI on the golden source (--known-issues). Firmware PR
# builds and release gating never pass a baseline, so everything below fails there. Native mode
# runs the loop and web-server tasks as truly parallel host threads, so the SFD#54 settings race
# loses writes far more often than in QEMU mode; see docs/native.md#limits.
version: 1
firmware_source_commit: 062f5f4eab842326883dbb919587dbcd76f22862
description: >-
  Golden v1.4.1 source built natively. The same firmware defects as the QEMU golden baseline: an
  unsynchronized settings store shared by the loop and web-server tasks (SFD#54) and unlocked UART
  output from two tasks (SFD#86). The QEMU-only intermittent I2C timeouts (#14) cannot occur here.

serial:
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 4: reading a key that was never written logs NOT_FOUND. Harmless noise that floods the log
      after the first save creates the namespace.
    regex: '^\[\s*\d+\]\[E\]\[Preferences\.cpp:\d+\] (getString|getBytesLength)\(\): nvs_get_(str|blob) len fail: \w+ NOT_FOUND$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1: the loop and web-server tasks share one Preferences handle without a lock, so one task's
      end() invalidates the other's read.
    regex: '^\[\s*\d+\]\[E\]\[Preferences\.cpp:\d+\] (getString|getBytesLength)\(\): nvs_get_(str|blob) (len )?fail: \w+ INVALID_HANDLE$'
  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      Two firmware tasks print to the UART without a shared lock, so request logging gets spliced into
      the otherwise allowed fresh-NVS begin/NOT_FOUND diagnostic. Where the split lands varies run to
      run. This entry covers the diagnostic's tail: it may start anywhere up to "nvs_open failed: NOT_FOUND"
      (e.g. "p:50] begin(): ..." or "(): nvs_open ..."; arduino-esp32 2.0.17 logs nvs_open failures
      only from Preferences.cpp:50), preceded by the other task's partial output
      (e.g. request-body JSON). Only a prefix with no brackets and no error keywords is accepted, and an
      unspliced line is left to the normal fresh_nvs policy. The writer/SDK locking path remains to be
      repaired.
    regex: '^(?!\[\s*\d+\]\[E\])(?:(?!(?i:error|failed|panic|abort|exception))[^\[\]])*?(?:(?:\[\s*)?\d{1,10}\]\[E\]\[Preferences\.cpp:50\] begin\(\): |(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:\])?\[)?E)?\])?\[)?P)?r)?e)?f)?e)?r)?e)?n)?c)?e)?s)?\.)?c)?p)?p)?:)?5)?0)?\])?\ )?b)?e)?g)?i)?n)?\()?\))?:)?\ )?)nvs_open failed: NOT_FOUND$'
  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      The head form of the same splice: the line starts with the diagnostic up to some character (from
      "[ timestamp][E][" through the whole "NOT_FOUND") and continues with the other task's output, which
      must be its request log ("Received ... update request") or request-body JSON with no brackets and no
      error keywords. Any other continuation, e.g. a different NVS error code, is still reported.
    regex: '^\[\s*\d+\]\[E\]\[(?:P(?:r(?:e(?:f(?:e(?:r(?:e(?:n(?:c(?:e(?:s(?:\.(?:c(?:p(?:p(?::(?:5(?:0(?:\](?:\ (?:b(?:e(?:g(?:i(?:n(?:\((?:\)(?::(?:\ (?:n(?:v(?:s(?:_(?:o(?:p(?:e(?:n(?:\ (?:f(?:a(?:i(?:l(?:e(?:d(?::(?:\ (?:N(?:O(?:T(?:_(?:F(?:O(?:U(?:N(?:D)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?(?:Received [a-z]+ update request|\{(?![^\[\]]*?(?i:error|failed|panic|abort|exception))[^\[\]]*)$'

  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      The middle form of the same splice: the other task's request log ("Received ... update request",
      without its newline) lands inside the diagnostic, which then finishes on the same line, e.g.
      "...nvs_open failed: Received text update requestNOT_FOUND". The regex lists every split point of
      the exact diagnostic after "[ timestamp][E][", so the two halves must rejoin into it unchanged; any
      other insertion or NVS error code is still reported.
    regex: '^\[\s*\d+\]\[E\]\[(?:Received [a-z]+ update requestPreferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PReceived [a-z]+ update requestreferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PrReceived [a-z]+ update requesteferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreReceived [a-z]+ update requestferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PrefReceived [a-z]+ update requesterences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PrefeReceived [a-z]+ update requestrences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferReceived [a-z]+ update requestences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PrefereReceived [a-z]+ update requestnces\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferenReceived [a-z]+ update requestces\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferencReceived [a-z]+ update requestes\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferenceReceived [a-z]+ update requests\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferencesReceived [a-z]+ update request\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.Received [a-z]+ update requestcpp:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cReceived [a-z]+ update requestpp:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpReceived [a-z]+ update requestp:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cppReceived [a-z]+ update request:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:Received [a-z]+ update request50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:5Received [a-z]+ update request0\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50Received [a-z]+ update request\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\]Received [a-z]+ update request begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] Received [a-z]+ update requestbegin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] bReceived [a-z]+ update requestegin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] beReceived [a-z]+ update requestgin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] begReceived [a-z]+ update requestin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] begiReceived [a-z]+ update requestn\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] beginReceived [a-z]+ update request\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] begin\(Received [a-z]+ update request\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\)Received [a-z]+ update request: nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\):Received [a-z]+ update request nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): Received [a-z]+ update requestnvs_open failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nReceived [a-z]+ update requestvs_open failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvReceived [a-z]+ update requests_open failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvsReceived [a-z]+ update request_open failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_Received [a-z]+ update requestopen failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_oReceived [a-z]+ update requestpen failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_opReceived [a-z]+ update requesten failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_opeReceived [a-z]+ update requestn failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_openReceived [a-z]+ update request failed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open Received [a-z]+ update requestfailed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open fReceived [a-z]+ update requestailed: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open faReceived [a-z]+ update requestiled: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open faiReceived [a-z]+ update requestled: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open failReceived [a-z]+ update requested: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open faileReceived [a-z]+ update requestd: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open failedReceived [a-z]+ update request: NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open failed:Received [a-z]+ update request NOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open failed: Received [a-z]+ update requestNOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open failed: NReceived [a-z]+ update requestOT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open failed: NOReceived [a-z]+ update requestT_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open failed: NOTReceived [a-z]+ update request_FOUND|Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_Received [a-z]+ update requestFOUND|Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FReceived [a-z]+ update requestOUND|Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOReceived [a-z]+ update requestUND|Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUReceived [a-z]+ update requestND|Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUNReceived [a-z]+ update requestD)$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Consequence of the lost pre-reboot settings write below (release-smoke-8 step 10): the reboot
      keeps the default sixteen-module configuration, so the absent bus-1 modules (0x20-0x27, 32-39)
      are reported once more by the final sweep. Policy checks that expect those lines are applied
      before this baseline; other write codes and addresses still fail.
    regex: '^Error writing data to module 3[2-9], error code: 2$'

expected_failures:
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: POST /settings returns success but the web task's writes are dropped (the loop task
      owns or closes the shared handle), so the reboot keeps 16 configured modules and never shows
      WIFI ERR.
    scenario: release-smoke-8
    step: 10
    action: wait_display
    error: timeout
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: GET /settings intermittently returns compiled defaults although the saved
      single-bus setting is in effect after the reboot.
    scenario: release-smoke-8
    step: 11
    action: http
    error:
      regex: '^JSON mismatch at \$\.wire1(Addresses|Offsets): expected '''', got ''[0-9,]+''$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: POST /text returns success but the mode write is lost, so the drums never move.
    scenario: release-smoke-8
    step: 14
    action: wait_display
    error: timeout
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: POST /text (dual-single) returns success but the mode write is lost, so the drums
      never move.
    scenario: release-smoke-16
    step: 8
    action: wait_display
    error: timeout
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 4: when the step-8 race does not occur, the scenario reaches its strict final check, and
      v1.4.1 is still logging the fresh-NVS begin/NOT_FOUND diagnostic because nothing has created the
      config namespace. Only that exact unspliced line is expected here; any other error still fails.
    scenario: release-smoke-16
    step: 11
    action: assert_no_errors
    error:
      regex: '^unexpected serial error: \[\s*\d+\]\[E\]\[Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race, first-boot flow: POST /settings returns success but the web task's writes are
      dropped, so the reboot keeps the 16-module default layout and never shows WIFI ERR.
    scenario: first-boot-8
    step: 11
    action: wait_display
    error: timeout
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race, first-boot flow: when the layout write survives, GET /settings can still return
      compiled defaults for the other saved fields.
    scenario: first-boot-8
    step: 12
    action: http
    error:
      regex: '^JSON mismatch at \$\.(name|wire1Addresses|wire1Offsets|wireOffsets|mqtt_server|mqtt_port): expected .+, got .+$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race, first-boot flow: the saved name, MQTT and offset values read back as compiled
      defaults after the reboot.
    scenario: first-boot-16
    step: 12
    action: http
    error:
      regex: '^JSON mismatch at \$\.(name|wire1Offsets|mqtt_server|mqtt_port): expected .+, got .+$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 4: when the race does not occur, the final strict check still sees the fresh-NVS
      begin/NOT_FOUND diagnostic, because nothing on v1.4.1 creates the config namespace.
    scenario: first-boot-8
    step: 18
    action: assert_no_errors
    error:
      regex: '^unexpected serial error: \[\s*\d+\]\[E\]\[Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 4: when the race does not occur, the final strict check still sees the fresh-NVS
      begin/NOT_FOUND diagnostic, because nothing on v1.4.1 creates the config namespace.
    scenario: first-boot-16
    step: 18
    action: assert_no_errors
    error:
      regex: '^unexpected serial error: \[\s*\d+\]\[E\]\[Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND$'
