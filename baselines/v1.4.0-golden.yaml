# Known-issue baseline for the checksum-pinned v1.4.0 golden image (esp32_n4 factory).
# Policy and exit criteria: https://github.com/DrewFerg11/Split-Flap-Emulator/issues/15
#
# Used only by the emulator's own golden CI runs (--known-issues). Release gating of new firmware
# never passes a baseline, so everything below fails there. Remove entries as their issues are fixed;
# delete this file when it is empty.
version: 1
firmware_sha256: a087801e2ba5e08154af28a636c310b988b43417f28c7ddb7bae4f3df9f6221e
description: >-
  Published v1.4.0 esp32_n4 factory image. Its settings store has an unsynchronized-access race and
  logs every never-written key as an error (SFD#54); see issue #15 for the full policy.

serial:
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 4: reading a key that was never written logs NOT_FOUND. Harmless noise that floods the log
      after the first save creates the namespace.
    regex: '^\[\s*\d+\]\[E\]\[Preferences\.cpp:\d+\] (getString|getBytesLength)\(\): nvs_get_(str|blob) len fail: \w+ NOT_FOUND$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1: the loop and web-server tasks share one Preferences handle without a lock, so one task's
      end() invalidates the other's read.
    regex: '^\[\s*\d+\]\[E\]\[Preferences\.cpp:\d+\] (getString|getBytesLength)\(\): nvs_get_(str|blob) len fail: \w+ INVALID_HANDLE$'
  - issue: DrewFerg11/Split-Flap-Emulator#14
    reason: >-
      Intermittent I2C read timeout in 16-module dual-bus runs; cause (firmware, QEMU scheduling or
      model) not yet established.
    regex: '^\[\s*\d+\]\[E\]\[Wire\.cpp:\d+\] requestFrom\(\): i2cRead returned Error 263$'
  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      Raw UART capture shows /text request logging spliced into the timestamp of an otherwise
      already allowed fresh-NVS begin/NOT_FOUND diagnostic. Where the split lands varies run to run:
      the line may start with the timestamp's digit suffix, or with the other task's partial output
      (e.g. a request-body fragment). Only a prefix with no brackets and no error keywords is
      accepted, followed by the exact message; the writer/SDK locking path remains to be repaired.
    regex: '^(?![^\[\]]*?(?i:error|failed|panic|abort|exception))[^\[\]]*?\d{1,10}\]\[E\]\[Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND$'

expected_failures:
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: GET /settings intermittently returns compiled defaults although the saved
      single-bus setting is in effect after the reboot.
    scenario: release-smoke-8
    step: 11
    action: http
    error:
      regex: '^JSON mismatch at \$\.wire1(Addresses|Offsets): expected '''', got ''[0-9,]+''$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: POST /text returns success but the mode write is lost, so the drums never move.
    scenario: release-smoke-8
    step: 14
    action: wait_display
    error: timeout
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: POST /text (dual-single) returns success but the mode write is lost, so the drums
      never move.
    scenario: release-smoke-16
    step: 8
    action: wait_display
    error: timeout
