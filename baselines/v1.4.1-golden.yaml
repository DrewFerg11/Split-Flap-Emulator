# Known-issue baseline for the checksum-pinned v1.4.1 golden image (esp32_n4 factory).
# Policy and exit criteria: https://github.com/DrewFerg11/Split-Flap-Emulator/issues/15
#
# Used only by the emulator's own golden CI runs (--known-issues). Release gating of new firmware
# never passes a baseline, so everything below fails there. Remove entries as their issues are fixed;
# delete this file when it is empty.
version: 1
firmware_sha256: 5a71579b127ee87f0716cb1df938c9f98d3519a9283f72c003dfb857db32e6f4
description: >-
  Published v1.4.1 esp32_n4 factory image. Since v1.4.0 only MQTT recovery and the version string
  changed, so every v1.4.0 entry is kept as it was; the #14 write-timeout entry is new. Its settings
  store has an unsynchronized-access race and logs every never-written key as an error (SFD#54); see
  issue #15 for the full policy.

serial:
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 4: reading a key that was never written logs NOT_FOUND. Harmless noise that floods the log
      after the first save creates the namespace.
    regex: '^\[\s*\d+\]\[E\]\[Preferences\.cpp:\d+\] (getString|getBytesLength)\(\): nvs_get_(str|blob) len fail: \w+ NOT_FOUND$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1: the loop and web-server tasks share one Preferences handle without a lock, so one task's
      end() invalidates the other's read. The handle can go stale between the length query and the
      read itself, which logs "nvs_get_str fail" without "len" (Preferences.cpp:490).
    regex: '^\[\s*\d+\]\[E\]\[Preferences\.cpp:\d+\] (getString|getBytesLength)\(\): nvs_get_(str|blob) (len )?fail: \w+ INVALID_HANDLE$'
  - issue: DrewFerg11/Split-Flap-Emulator#14
    reason: >-
      Emulator scheduling artifact in 16-module dual-bus runs. QEMU runs the two cores in turn, so
      ESP-IDF's I2C ISR on core 1 can be parked between posting DONE to the Wire1 task on core 0
      and setting the driver idle; the task's next transfer then has its interrupt ignored and
      times out (here a hall-sensor read: Error 263). Real parallel cores cannot interleave this
      way. A read loses no coil pattern, so this line excuses no stall.
    regex: '^\[\s*\d+\]\[E\]\[Wire\.cpp:\d+\] requestFrom\(\): i2cRead returned Error 263$'
  - issue: DrewFerg11/Split-Flap-Emulator#14
    reason: >-
      The write-side form of the same emulator scheduling artifact: Wire endTransmission code 5
      (timeout). Only the address reached the module, so its coil pattern was lost and one drum
      stall may follow; each such line excuses one stall. Other write codes (e.g. 2, missing module)
      are not covered.
    explains_stalls: 1
    regex: '^Error writing data to module \d+, error code: 5$'
  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      Two firmware tasks print to the UART without a shared lock, so request logging gets spliced into
      the otherwise allowed fresh-NVS begin/NOT_FOUND diagnostic. Where the split lands varies run to
      run. This entry covers the diagnostic's tail: it may start anywhere up to "nvs_open failed: NOT_FOUND"
      (e.g. "p:50] begin(): ..." or "(): nvs_open ..."; arduino-esp32 2.0.17 logs nvs_open failures
      only from Preferences.cpp:50), preceded by the other task's partial output
      (e.g. request-body JSON). Only a prefix with no brackets and no error keywords is accepted, and an
      unspliced line is left to the normal fresh_nvs policy. The writer/SDK locking path remains to be
      repaired.
    regex: '^(?!\[\s*\d+\]\[E\])(?:(?!(?i:error|failed|panic|abort|exception))[^\[\]])*?(?:(?:\[\s*)?\d{1,10}\]\[E\]\[Preferences\.cpp:50\] begin\(\): |(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:(?:\])?\[)?E)?\])?\[)?P)?r)?e)?f)?e)?r)?e)?n)?c)?e)?s)?\.)?c)?p)?p)?:)?5)?0)?\])?\ )?b)?e)?g)?i)?n)?\()?\))?:)?\ )?)nvs_open failed: NOT_FOUND$'
  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      The head form of the same splice: the line starts with the diagnostic up to some character (from
      "[ timestamp][E][" through the whole "NOT_FOUND") and continues with the other task's output, which
      must be its request log ("Received ... update request") or request-body JSON with no brackets and no
      error keywords. Any other continuation, e.g. a different NVS error code, is still reported.
    regex: '^\[\s*\d+\]\[E\]\[(?:P(?:r(?:e(?:f(?:e(?:r(?:e(?:n(?:c(?:e(?:s(?:\.(?:c(?:p(?:p(?::(?:5(?:0(?:\](?:\ (?:b(?:e(?:g(?:i(?:n(?:\((?:\)(?::(?:\ (?:n(?:v(?:s(?:_(?:o(?:p(?:e(?:n(?:\ (?:f(?:a(?:i(?:l(?:e(?:d(?::(?:\ (?:N(?:O(?:T(?:_(?:F(?:O(?:U(?:N(?:D)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?(?:Received [a-z]+ update request|\{(?![^\[\]]*?(?i:error|failed|panic|abort|exception))[^\[\]]*)$'

  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      The middle form of the same splice: the other task's request log ("Received ... update request",
      without its newline) lands inside the diagnostic, which then finishes on the same line, e.g.
      "...nvs_open failed: Received text update requestNOT_FOUND". The regex lists every split point of
      the exact diagnostic after "[ timestamp][E][", so the two halves must rejoin into it unchanged; any
      other insertion or NVS error code is still reported.
    regex: '^\[\s*\d+\]\[E\]\[(?:Received [a-z]+ update requestPreferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PReceived [a-z]+ update requestreferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PrReceived [a-z]+ update requesteferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreReceived [a-z]+ update requestferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PrefReceived [a-z]+ update requesterences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PrefeReceived [a-z]+ update requestrences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferReceived [a-z]+ update requestences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PrefereReceived [a-z]+ update requestnces\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferenReceived [a-z]+ update requestces\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferencReceived [a-z]+ update requestes\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferenceReceived [a-z]+ update requests\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|PreferencesReceived [a-z]+ update request\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.Received [a-z]+ update requestcpp:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cReceived [a-z]+ update requestpp:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpReceived [a-z]+ update requestp:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cppReceived [a-z]+ update request:50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:Received [a-z]+ update request50\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:5Received [a-z]+ update request0\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50Received [a-z]+ update request\] begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\]Received [a-z]+ update request begin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] Received [a-z]+ update requestbegin\(\): nvs_open failed: NOT_FOUND|Preferences\.cpp:50\] bReceived [a-z]+ update requestegin\(\): nvs_open faile