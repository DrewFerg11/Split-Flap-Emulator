# Known-issue baseline for the checksum-pinned v1.4.1 golden image (esp32_n4 factory).
# Policy and exit criteria: https://github.com/DrewFerg11/Split-Flap-Emulator/issues/15
#
# Used only by the emulator's own golden CI runs (--known-issues). Release gating of new firmware
# never passes a baseline, so everything below fails there. Remove entries as their issues are fixed;
# delete this file when it is empty.
version: 1
firmware_sha256: 5a71579b127ee87f0716cb1df938c9f98d3519a9283f72c003dfb857db32e6f4
description: >-
  Published v1.4.1 esp32_n4 factory image. Since v1.4.0 only MQTT recovery and the version string
  changed, so the v1.4.0 entries carry over unchanged. Its settings store has an unsynchronized-access
  race and logs every never-written key as an error (SFD#54); see issue #15 for the full policy.

serial:
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 4: reading a key that was never written logs NOT_FOUND. Harmless noise that floods the log
      after the first save creates the namespace.
    regex: '^\[\s*\d+\]\[E\]\[Preferences\.cpp:\d+\] (getString|getBytesLength)\(\): nvs_get_(str|blob) len fail: \w+ NOT_FOUND$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1: the loop and web-server tasks share one Preferences handle without a lock, so one task's
      end() invalidates the other's read.
    regex: '^\[\s*\d+\]\[E\]\[Preferences\.cpp:\d+\] (getString|getBytesLength)\(\): nvs_get_(str|blob) len fail: \w+ INVALID_HANDLE$'
  - issue: DrewFerg11/Split-Flap-Emulator#14
    reason: >-
      Intermittent I2C read timeout in 16-module dual-bus runs; cause (firmware, QEMU scheduling or
      model) not yet established.
    regex: '^\[\s*\d+\]\[E\]\[Wire\.cpp:\d+\] requestFrom\(\): i2cRead returned Error 263$'
  - issue: DrewFerg11/Split-Flap-Emulator#14
    reason: >-
      The write-side form of the same intermittent 16-module dual-bus I2C timeout: the firmware reports
      Wire endTransmission code 5 (timeout). Seen once in the container smoke-16 run for PR #26 at the
      same step 6 as the read timeout. Other write codes (e.g. 2, missing module) are not covered.
    regex: '^Error writing data to module \d+, error code: 5$'
  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      Two firmware tasks print to the UART without a shared lock, so request logging gets spliced into
      the otherwise allowed fresh-NVS begin/NOT_FOUND diagnostic. Where the split lands varies run to
      run: the line ends with the diagnostic's tail starting anywhere in its "[ timestamp]" (a bare digit
      suffix, or the full "[ 38162]"), preceded by the other task's partial output (e.g. request-body
      JSON). Only a prefix with no brackets and no error keywords is accepted, and an unspliced line is
      left to the normal fresh_nvs policy. The writer/SDK locking path remains to be repaired.
    regex: '^(?!\[\s*\d+\]\[E\])(?![^\[\]]*?(?i:error|failed|panic|abort|exception))[^\[\]]*?(?:\[\s*)?\d{1,10}\]\[E\]\[Preferences\.cpp:50\] begin\(\): nvs_open failed: NOT_FOUND$'

expected_failures:
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: GET /settings intermittently returns compiled defaults although the saved
      single-bus setting is in effect after the reboot.
    scenario: release-smoke-8
    step: 11
    action: http
    error:
      regex: '^JSON mismatch at \$\.wire1(Addresses|Offsets): expected '''', got ''[0-9,]+''$'
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: POST /text returns success but the mode write is lost, so the drums never move.
    scenario: release-smoke-8
    step: 14
    action: wait_display
    error: timeout
  - issue: DrewFerg11/Split-Flap-Display#54
    reason: >-
      Item 1 race: POST /text (dual-single) returns success but the mode write is lost, so the drums
      never move.
    scenario: release-smoke-16
    step: 8
    action: wait_display
    error: timeout
