  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      The middle form of the same splice: the other task's request log ("Received text|settings update
      request") or a whole request body, without its newline, lands inside the diagnostic, which then
      finishes on the same line, e.g. "...nvs_open failed: Received text update requestNOT_FOUND" or
      '[ 38085][{"mode":"dual-single",...}E][Preferences.cpp:50] ...'. It may land anywhere after the
      first "[", and the two halves must rejoin into the exact diagnostic. The inserted body must have
      the shapes tools/sfd86_patterns.py documents. Any other insertion or NVS error code is still
      reported.
