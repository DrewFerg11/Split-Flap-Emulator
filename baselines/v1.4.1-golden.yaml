  - issue: DrewFerg11/Split-Flap-Display#86
    reason: >-
      The request-body form of the splice: a whole POST /text or /settings request body, in the shapes
      tools/sfd86_patterns.py documents, is followed on the same line by the head of the fresh-NVS
      diagnostic, from
      "[ timestamp][E][" up to "begin(): " (the last cut the tail entry above can resume from), e.g.
      '{"mode":"dual-single",...}[ 38172][E][Preferences'. The rest of the diagnostic resumes on the
      next line and is covered by the tail entry above. Any other text before the head, a cut past
      "begin(): ", or any other continuation is still reported.
