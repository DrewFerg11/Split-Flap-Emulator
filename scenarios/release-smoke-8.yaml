version: 1
name: release-smoke-8
timeout: 300
steps:
  - wait_serial: "=== Split Flap Display ==="
    timeout: 120
  - wait_serial: "AP IP Address: http://192.168.4.1"
    timeout: 30
  - wait_display: {text: XXXXXXXX}
    timeout: 120
  - expect_serial: "Firmware: ${FIRMWARE_VERSION} ("
  - http: {path: /version, status: 200, json: {version: "${FIRMWARE_VERSION}"}, wait_ready: true}
    timeout: 60
  - assert_no_errors: {fresh_nvs: true, default_missing_bus1: true}
  - http:
      method: POST
      path: /settings
      body: {wire1Addresses: "", wire1Offsets: ""}
      status: 200
      json: {type: success}
    timeout: 60
  - wait_serial: "Reset reason: software reset"
    timeout: 120
  - wait_serial: "AP IP Address: http://192.168.4.1"
    timeout: 30
  - wait_display: {text: "WIFI ERR"}
    timeout: 120
  - http:
      path: /settings
      status: 200
      json: {wire1Addresses: "", wire1Offsets: ""}
      wait_ready: true
    timeout: 60
  - assert_no_errors: {fresh_nvs: true}
  - http:
      method: POST
      path: /text
      body: {mode: single, words: [HELLO], center: true}
      status: 200
      json: {type: success}
    timeout: 30
  - wait_display: {text: " HELLO  "}
    timeout: 120
  - assert_no_errors: {}
